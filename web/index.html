<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#08090c">
    <title>PCPanel — Performance</title>
    <link rel="stylesheet" href="/css/app.css">
  </head>
  <body>
    <div class="app-shell" id="app-shell">
      <header class="topbar">
        <a class="brand" href="#performance" aria-label="PCPanel Performance">
          <span class="brand__mark" aria-hidden="true"><i></i><i></i></span>
          <span>PCPanel</span>
        </a>

        <div class="topbar__actions">
          <div class="connection connection--connecting" id="connection" role="status" aria-live="polite" aria-label="Estado da conexão: Connecting">
            <span class="connection__dot" aria-hidden="true"></span>
            <span id="connection-label">Connecting</span>
          </div>
        </div>
      </header>

      <main class="workspace">
        <section class="view view--active" id="performance-view" data-view="performance" aria-label="Performance do hardware">
          <div class="hardware-grid" id="hardware-grid"></div>
          <div class="memory-grid" id="memory-grid"></div>
        </section>

        <section class="view empty-view" id="apps-view" data-view="apps" aria-labelledby="apps-title" hidden>
          <span class="empty-view__icon" aria-hidden="true">▦</span>
          <div><h1 id="apps-title">Apps</h1><p>Visão de aplicativos reservada para uma próxima etapa.</p></div>
        </section>

        <section class="view empty-view" id="system-view" data-view="system" aria-labelledby="system-title" hidden>
          <span class="empty-view__icon" aria-hidden="true">⌁</span>
          <div><h1 id="system-title">Sistema</h1><p>Detalhes do PC serão conectados futuramente.</p></div>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="Navegação principal">
        <button class="bottom-nav__item is-active" type="button" data-target="performance" aria-current="page">
          <span aria-hidden="true">⌁</span><b>Performance</b>
        </button>
        <button class="bottom-nav__item" type="button" data-target="apps">
          <span aria-hidden="true">▦</span><b>Apps</b>
        </button>
        <button class="bottom-nav__item" type="button" data-target="system">
          <span aria-hidden="true">⚙</span><b>Sistema</b>
        </button>
      </nav>
    </div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
